name: build-tv

# 三种触发方式：
#   1. push 到 master（上游同步后自动触发）
#   2. 推送 tv_* 标签
#   3. 手动点 Run workflow
on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "tv_*"
    paths-ignore:
      - "README*"
      - "*.md"
      - "assets/**"

jobs:
  build-tv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      # --- TV 签名配置 ---
      - name: Download TV keystore
        id: tv_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: tv_keystore.jks
          encodedString: ${{ secrets.TV_KEYSTORE_BASE64 }}

      - name: Create TV key.properties
        run: |
          echo "storeFile=${{ steps.tv_keystore.outputs.filePath }}" > simple_live_tv_app/android/key.properties
          echo "storePassword=${{ secrets.TV_STORE_PASSWORD }}" >> simple_live_tv_app/android/key.properties
          echo "keyPassword=${{ secrets.TV_KEY_PASSWORD }}" >> simple_live_tv_app/android/key.properties
          echo "keyAlias=${{ secrets.TV_KEY_ALIAS }}" >> simple_live_tv_app/android/key.properties

      # --- 环境 ---
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      # --- 构建前升级构建链依赖（Flutter 3.47 的最低要求）---
      #     项目自带 Gradle 8.12 / AGP 8.9.1 均低于 Flutter 3.47 要求的 8.14 / 8.11.1
      #     这里在构建时就地升级，不改动仓库文件，上游同步不会冲突
      - name: Bump Gradle / AGP / Kotlin to Flutter 3.47 requirements
        run: |
          cd simple_live_tv_app/android
          sed -i 's|gradle-8\.12-all\.zip|gradle-8.14.3-all.zip|' gradle/wrapper/gradle-wrapper.properties
          sed -i 's|id("com.android.application") version "8.9.1"|id("com.android.application") version "8.11.1"|' settings.gradle.kts
          sed -i 's|id("org.jetbrains.kotlin.android") version "2.1.0"|id("org.jetbrains.kotlin.android") version "2.2.20"|' settings.gradle.kts
          echo "--- gradle wrapper ---"; grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          echo "--- AGP ---"; grep 'com.android.application' settings.gradle.kts
          echo "--- Kotlin ---"; grep 'jetbrains.kotlin.android' settings.gradle.kts

      # --- 统一所有子项目(含插件) JVM target = 17 ---
      #     插件硬编码 1.8/11/17，与 Kotlin 17 不一致会在随机插件上轮流报
      #     "Inconsistent JVM Target Compatibility Between Java and Kotlin Tasks"
      - name: Unify JVM target to 17
        run: python3 .ci/patch_jvm_target.py . simple_live_tv_app

      - name: Restore packages
        run: |
          cd simple_live_tv_app
          flutter pub get

      # --- 打包 TV APK（分 ABI）---
      - name: Build TV APK
        run: |
          cd simple_live_tv_app
          flutter build apk --release --split-per-abi

      - name: Upload TV APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      # --- 读取版本号（pubspec 形如 1.6.5+10605）---
      - name: Read version
        id: ver
        run: |
          cd simple_live_tv_app
          RAW=$(grep -oP '^version:\s*\K[0-9.]+' pubspec.yaml | head -1)
          echo "version=$RAW" >> $GITHUB_OUTPUT
          echo "版本: $RAW"
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # --- 自动发 Release ---
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "tv_v${{ steps.ver.outputs.version }}.${{ github.run_number }}"
          name: "TV ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})"
          body: |
            自动构建 · 上游提交 `${{ steps.ver.outputs.sha }}`

            - 分 ABI 的 Android TV APK
            - 签名与之前一致，可直接覆盖安装
          files: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          token: ${{ secrets.TOKEN }}
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

      # --- 清理旧 Release：同名 tag 只保留最新，删掉历史遗留的 run_number 版 ---
      - name: Prune stale releases
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          # 保留最新 3 个 Release，其余删除（含 tag）
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
          | while read -r tag; do
              [ -z "$tag" ] && continue
              echo "删除旧 Release: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            done
