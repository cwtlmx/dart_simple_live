name: build-app

# 三种触发方式：
#   1. push 到 master（上游同步后自动触发）
#   2. 推送 v* 标签
#   3. 手动点 Run workflow
on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths-ignore:
      - "README*"
      - "*.md"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: gradle

      # --- APP 签名配置 ---
      #     Gradle 里 storeFile 是相对 android/app/ 解析的（file(it)），
      #     所以必须写绝对路径，否则报 "Keystore file ... not found"
      - name: Download APP keystore
        id: app_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create APP key.properties
        run: |
          echo "storeFile=${{ steps.app_keystore.outputs.filePath }}" > simple_live_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> simple_live_app/android/key.properties
          echo "--- key.properties ---"; sed 's/Password=.*/Password=***/' simple_live_app/android/key.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      # --- 构建前升级构建链依赖（Flutter 3.47 的最低要求）---
      #     项目自带 Gradle 8.12 / AGP 8.9.1 / Kotlin 2.1.0 均低于 Flutter 3.47 要求
      #     这里在构建时就地升级，不改动仓库文件，上游同步不会冲突
      - name: Bump Gradle / AGP / Kotlin to Flutter 3.47 requirements
        run: |
          cd simple_live_app/android
          sed -i 's|gradle-8\.12-all\.zip|gradle-8.14.3-all.zip|' gradle/wrapper/gradle-wrapper.properties
          sed -i 's|id("com.android.application") version "8.9.1"|id("com.android.application") version "8.11.1"|' settings.gradle.kts
          sed -i 's|id("org.jetbrains.kotlin.android") version "2.1.0"|id("org.jetbrains.kotlin.android") version "2.2.20"|' settings.gradle.kts
          echo "--- gradle wrapper ---"; grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          echo "--- AGP ---"; grep 'com.android.application' settings.gradle.kts
          echo "--- Kotlin ---"; grep 'jetbrains.kotlin.android' settings.gradle.kts

      # --- 统一所有子项目(含插件) JVM target = 17 ---
      #     插件硬编码 1.8/11/17，与 Kotlin 17 不一致会在随机插件上轮流报
      #     "Inconsistent JVM Target Compatibility Between Java and Kotlin Tasks"
      - name: Unify JVM target to 17
        run: python3 .ci/patch_jvm_target.py . simple_live_app

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # --- 打包（分 ABI，与原 workflow 一致）---
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      # --- 读取版本号（pubspec 形如 1.11.4+11104）---
      - name: Read version
        id: ver
        run: |
          cd simple_live_app
          RAW=$(grep -oP '^version:\s*\K[0-9.]+' pubspec.yaml | head -1)
          echo "version=$RAW" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "版本: $RAW"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk

      # --- 自动发 Release（tag 用版本号，重复运行会覆盖同一 tag 的产物）---
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "app_v${{ steps.ver.outputs.version }}"
          name: "APP ${{ steps.ver.outputs.version }}"
          body: |
            自动构建 · 上游提交 `${{ steps.ver.outputs.sha }}`

            - 分 ABI 的 Android 手机 APK
            - 签名与之前一致，可直接覆盖安装
          files: simple_live_app/build/app/outputs/flutter-apk/*.apk
          token: ${{ secrets.TOKEN }}
          prerelease: false
          make_latest: true
