name: build-app

# 三种触发方式：
#   1. push 到 master（上游同步后自动触发）
#   2. 推送 v* 标签
#   3. 手动点 Run workflow
on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths-ignore:
      - ".github/**"
      - "README*"
      - "*.md"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: gradle

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > simple_live_app/android/keystore.jks
          cat > simple_live_app/android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      # --- 构建前升级构建链依赖（Flutter 3.47 的最低要求）---
      #     项目自带 Gradle 8.12 / AGP 8.9.1 / Kotlin 2.1.0 均低于 Flutter 3.47 要求
      #     这里在构建时就地升级，不改动仓库文件，上游同步不会冲突
      - name: Bump Gradle / AGP / Kotlin to Flutter 3.47 requirements
        run: |
          cd simple_live_app/android
          sed -i 's|gradle-8\.12-all\.zip|gradle-8.14.3-all.zip|' gradle/wrapper/gradle-wrapper.properties
          sed -i 's|id("com.android.application") version "8.9.1"|id("com.android.application") version "8.11.1"|' settings.gradle.kts
          sed -i 's|id("org.jetbrains.kotlin.android") version "2.1.0"|id("org.jetbrains.kotlin.android") version "2.2.20"|' settings.gradle.kts
          echo "--- gradle wrapper ---"; grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          echo "--- AGP ---"; grep 'com.android.application' settings.gradle.kts
          echo "--- Kotlin ---"; grep 'jetbrains.kotlin.android' settings.gradle.kts

      # --- 统一所有子项目(含插件) JVM target = 17 ---
      #     插件硬编码 1.8/11/17，与 Kotlin 17 不一致会在随机插件上轮流报
      #     "Inconsistent JVM Target Compatibility Between Java and Kotlin Tasks"
      - name: Unify JVM target to 17
        run: python3 .ci/patch_jvm_target.py . simple_live_app

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # --- 打包（分 ABI，与原 workflow 一致）---
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: "Simple Live APP ${{ github.run_number }}"
          body: |
            自动构建自上游 master（run #${{ github.run_number }}）
            commit: ${{ github.sha }}
          files: simple_live_app/build/app/outputs/flutter-apk/*.apk
          token: ${{ secrets.TOKEN }}
          draft: false
          prerelease: false
