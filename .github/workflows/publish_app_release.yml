name: build-app

# 三种触发方式：
#   1. push 到 master（上游同步后自动触发）
#   2. 推送 v* 标签
#   3. 手动点 Run workflow
on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "assets/**"
      - ".github/workflows/sync-upstream.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      # --- 签名配置 ---
      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > simple_live_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> simple_live_app/android/key.properties

      # --- 环境 ---
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      # --- 构建前升级构建链依赖（Flutter 3.47 的最低要求）---
      #     项目自带 Gradle 8.12 / AGP 8.9.1 均低于 Flutter 3.47 要求的 8.14 / 8.11.1
      #     这里在构建时就地升级，不改动仓库文件，上游同步不会冲突
      - name: Bump Gradle & AGP to Flutter 3.47 requirements
        run: |
          cd simple_live_app/android
          sed -i 's|gradle-8\.12-all\.zip|gradle-8.14.3-all.zip|' gradle/wrapper/gradle-wrapper.properties
          sed -i 's|id("com.android.application") version "8.9.1"|id("com.android.application") version "8.11.1"|' settings.gradle.kts
          echo "--- gradle wrapper ---"; grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          echo "--- AGP ---"; grep 'com.android.application' settings.gradle.kts

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # --- 打包（分 ABI，与原 workfflow 一致）---
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      # --- 读取版本号（pubspec 形如 1.11.4+11104）---
      - name: Read version
        id: ver
        run: |
          cd simple_live_app
          RAW=$(grep -oP '^version:\s*\K[0-9.]+' pubspec.yaml | head -1)
          echo "version=$RAW" >> $GITHUB_OUTPUT
          echo "版本: $RAW"
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # --- 自动发 Release ---
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.ver.outputs.version }}.${{ github.run_number }}"
          name: "APP ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})"
          body: |
            自动构建 · 上游提交 `${{ steps.ver.outputs.sha }}`

            - 分 ABI 的 APK（arm64-v8a / armeabi-v7a / x86_64）
            - 签名与之前一致，可直接覆盖安装
          files: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          token: ${{ secrets.TOKEN }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
